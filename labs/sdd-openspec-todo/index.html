<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>TODO</h1>

      <form id="add-form" novalidate>
        <label for="title-input">やること</label>
        <input id="title-input" type="text" autocomplete="off" />
        <label for="due-input">期限（任意）</label>
        <input id="due-input" type="date" />
        <button type="submit">追加</button>
      </form>

      <div id="filters" role="group" aria-label="絞り込み">
        <button type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" data-filter="active" aria-pressed="false">未完了</button>
        <button type="button" data-filter="completed" aria-pressed="false">完了</button>
      </div>

      <p id="message" role="status"></p>

      <ul id="todo-list" aria-label="やることの一覧"></ul>
      <p id="empty-message" hidden></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
