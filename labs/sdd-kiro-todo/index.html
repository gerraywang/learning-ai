<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>TODO</h1>

      <form id="add-form" novalidate>
        <label for="title-input">内容</label>
        <input id="title-input" name="title" type="text" />

        <label for="due-input">期限</label>
        <input id="due-input" name="due" type="date" required />

        <button type="submit">追加</button>
      </form>

      <ul id="input-errors" role="alert"></ul>

      <p id="notice" role="status"></p>

      <div id="filters" role="group" aria-label="表示の切り替え">
        <button type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" data-filter="active" aria-pressed="false">未完了</button>
        <button type="button" data-filter="completed" aria-pressed="false">完了</button>
      </div>

      <ul id="todo-list" aria-label="TODO の一覧"></ul>
      <p id="empty-message" hidden></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
